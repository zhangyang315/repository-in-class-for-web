<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>出行工具 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-plane"></i>
      <span>出行工具</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>

<div class="container container-page">
  <h1 class="page-title">出行工具合集</h1>
  <p class="page-desc">便捷出行，轻松旅程</p>

  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/铁路12306.png" class="app-icon">
      <div class="tool-name">铁路12306</div>
      <div class="tool-desc">官方火车票购票平台</div>
      <a href="https://www.12306.cn/" target="_blank" class="tool-btn">打开</a>
    </div>

    <div class="tool-card">
      <img src="img/携程旅行.png" class="app-icon">
      <div class="tool-name">携程旅行</div>
      <div class="tool-desc">一站式旅行服务平台</div>
      <a href="https://www.ctrip.com/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/去哪儿旅行.png" class="app-icon">
      <div class="tool-name">去哪儿旅行</div>
      <div class="tool-desc">旅游出行比价平台</div>
      <a href="https://www.qunar.com/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/同程旅行.png" class="app-icon">
      <div class="tool-name">同程旅行</div>
      <div class="tool-desc">一站式出行服务平台</div>
      <a href="https://www.ly.com/" target="_blank" class="tool-btn">下载</a>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
