<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>聊天工具 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-comments"></i>
      <span>聊天工具</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>
<div class="container container-page">
  <h1 class="page-title">聊天工具合集</h1>
  <p class="page-desc">及时沟通，提升效率</p>
  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/微信.png" class="app-icon">
      <div class="tool-name">微信</div>
      <div class="tool-desc">全民社交聊天工具</div>
      <a href="https://weixin.qq.com/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/QQ.png" class="app-icon">
      <div class="tool-name">QQ</div>
      <div class="tool-desc">经典即时通讯工具</div>
      <a href="https://im.qq.com/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/钉钉.png" class="app-icon">
      <div class="tool-name">钉钉</div>
      <div class="tool-desc">办公协作沟通平台</div>
      <a href="https://www.dingtalk.com/download?spm=a213l2.13146415.0.0.7f151ef79O8ko9" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/飞书.png" class="app-icon">
      <div class="tool-name">飞书</div>
      <div class="tool-desc">企业级协同办公工具</div>
      <a href="https://www.feishu.cn/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/企业微信.png" class="app-icon">
      <div class="tool-name">企业微信</div>
      <div class="tool-desc">企业内部沟通工具</div>
      <a href="https://work.weixin.qq.com/" target="_blank" class="tool-btn">下载</a>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
