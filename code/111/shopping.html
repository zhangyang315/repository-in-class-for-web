<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>购物商城 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-shopping-cart"></i>
      <span>购物商城</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>
<div class="container container-page">
  <h1 class="page-title">购物商城合集</h1>
  <p class="page-desc">便捷购物，品质生活</p>
  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/淘宝.png" class="app-icon">
      <div class="tool-name">淘宝</div>
      <div class="tool-desc">亚洲最大的网络零售商圈</div>
      <a href="https://www.taobao.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/天猫.png" class="app-icon">
      <div class="tool-name">天猫</div>
      <div class="tool-desc">阿里巴巴旗下的品牌购物平台</div>
      <a href="https://www.tmall.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/京东.png" class="app-icon">
      <div class="tool-name">京东</div>
      <div class="tool-desc">专业的综合网上购物商城</div>
      <a href="https://www.jd.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/拼多多.png" class="app-icon">
      <div class="tool-name">拼多多</div>
      <div class="tool-desc">专注于拼团的第三方社交电商平台</div>
      <a href="https://www.pinduoduo.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/唯品会.png" class="app-icon">
      <div class="tool-name">唯品会</div>
      <div class="tool-desc">专门做特卖的网站</div>
      <a href="https://www.vip.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/苏宁易购.png" class="app-icon">
      <div class="tool-name">苏宁易购</div>
      <div class="tool-desc">领先的综合网上购物平台</div>
      <a href="https://www.suning.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/亚马逊.png" class="app-icon">
      <div class="tool-name">亚马逊中国</div>
      <div class="tool-desc">全球领先的电商平台</div>
      <a href="https://www.amazon.cn/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/当当.png" class="app-icon">
      <div class="tool-name">当当</div>
      <div class="tool-desc">知名的综合性网上购物商城</div>
      <a href="https://www.dangdang.com/" target="_blank" class="tool-btn">打开</a>
    </div>
  </div>
</div>
</body>
</html>
