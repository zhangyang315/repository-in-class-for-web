<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>网页工具 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-globe"></i>
      <span>网页工具</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>

<div class="container container-page">
  <h1 class="page-title">网页工具合集</h1>
  <p class="page-desc">免下载,即开即用</p>

  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/geekerwan.png" class="app-icon">
      <div class="tool-name">SocPK</div>
      <div class="tool-desc">极客湾移动芯片排行</div>
      <a href="https://www.socpk.com/" target="_blank" class="tool-btn">打开</a>
    </div>

    <div class="tool-card">
      <img src="img/imagestool.png" class="app-icon">
      <div class="tool-name">图片工具</div>
      <div class="tool-desc">图片处理工具</div>
      <a href="https://imagestool.com/zh_CN/" target="_blank" class="tool-btn">打开</a>
    </div>

    <div class="tool-card">
      <img src="img/passwdgenerator.png" class="app-icon">
      <div class="tool-name">密码生成器</div>
      <div class="tool-desc">安全密码生成工具</div>
      <a href="https://suijimimashengcheng.bmcx.com/" target="_blank" class="tool-btn">打开</a>
    </div>

    <div class="tool-card">
      <img src="img/cesuwang.png" class="app-icon">
      <div class="tool-name">测网速</div>
      <div class="tool-desc">网络速度测试工具</div>
      <a href="https://www.speedtest.cn/" target="_blank" class="tool-btn">打开</a>
    </div>
  </div>
</div>

</body>
</html>
