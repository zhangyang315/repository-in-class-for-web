<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>综合表单练习</title>
</head>
<body>
    <h2>个人完善信息登记表</h2>
    <form action="#" method="post">
        <input type="hidden" name="user_type" value="student">
        <p>
            <label for="username">用户名: </label>
            <input type="text" id="username" name="username" maxlength="12" required placeholder="4-12位字符">
        </p>
        <p>
            <label for="pwd">登录密码: </label>
            <input type="password" id="pwd" name="pwd" required placeholder="请设置6-16位密码">
        </p>
        <p>
            性别: 
            <input type="radio" name="gender" id="male" checked>
            <label for="male">男</label>
            <input type="radio" name="gender" id="female">
            <label for="female">女</label>
        </p>
        <p>
            兴趣爱好: 
            <label><input type="checkbox" name="hobby" value="read">阅读</label>
            <label><input type="checkbox" name="hobby" value="sport">运动</label>
            <label><input type="checkbox" name="hobby" value="music">音乐</label>
            <label><input type="checkbox" name="hobby" value="game">游戏</label>
            <label><input type="checkbox" name="hobby" value="travel">旅行</label>
        </p>
        <p>
            <label for="city">所在城市: </label>
            <select id="city" name="city">
                <optgroup label="华北地区">
                    <option>北京</option>
                    <option>天津</option>
                    <option>石家庄</option>
                </optgroup>
                <optgroup label="华东地区">
                    <option selected>上海</option>
                    <option>南京</option>
                    <option>杭州</option>
                </optgroup>
                <optgroup label="华南地区">
                    <option>广州</option>
                    <option>深圳</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="email">常用邮箱: </label>
            <input type="email" id="email" name="email" required placeholder="example@xxx.com">
        </p>
        <p>
            <label for="url">个人主页: </label>
            <input type="url" id="url" name="url" placeholder="https://xxx.com">
        </p>
        <p>
            <label for="tel">联系电话: </label>
            <input type="tel" id="tel" name="tel" placeholder="请输入手机号">
        </p>
        <p>
            <label for="age">年龄: </label>
            <input type="number" id="age" name="age" min="1" max="120" value="20">
        </p>
        <p>
            <label>服务满意度: </label>
            <input type="range" name="score" min="0" max="10" value="8"> [0~10分]
        </p>
        <p>
            <label>出生日期: </label>
            <input type="date" name="birth">
        </p>
        <p>
            <label>入学年月: </label>
            <input type="month" name="enter_month">
        </p>
        <p>
            <label>本周计划: </label>
            <input type="week" name="plan_week">
        </p>
        <p>
            <label>上传头像: </label>
            <input type="file" name="avatar" accept="image/*">
        </p>
        <p>
            <label for="intro">个人详细简介: </label><br>
            <textarea id="intro" name="intro" cols="50" rows="6" maxlength="200" placeholder="请详细介绍自己，最多200字"></textarea>
        </p>
        <p>
            <input type="submit" value="提交完整信息">
            <input type="reset" value="一键重置所有内容">
        </p>
    </form>
</body>
</html>
