<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>操作系统 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-desktop"></i>
      <span>操作系统</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>

<div class="container container-page">
  <h1 class="page-title">操作系统合集</h1>
  <p class="page-desc">探索不同的操作系统世界</p>

  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/windows11.png" class="app-icon">
      <div class="tool-name">Windows 11</div>
      <div class="tool-desc">微软最新桌面操作系统</div>
      <a href="https://www.microsoft.com/software-download/windows11" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/itellyou.png" class="app-icon">
      <div class="tool-name">iTellYou</div>
      <div class="tool-desc">系统镜像下载站</div>
      <a href="https://msdn.itellyou.cn/" target="_blank" class="tool-btn">打开</a>
    </div>

    <div class="tool-card">
      <img src="img/ubuntu.png" class="app-icon">
      <div class="tool-name">Ubuntu</div>
      <div class="tool-desc">最流行的Linux发行版</div>
      <a href="https://ubuntu.com/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/deepin.png" class="app-icon">
      <div class="tool-name">Deepin</div>
      <div class="tool-desc">国产优秀Linux发行版</div>
      <a href="https://www.deepin.org/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/debian.png" class="app-icon">
      <div class="tool-name">Debian</div>
      <div class="tool-desc">稳定可靠的Linux发行版</div>
      <a href="https://www.debian.org/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/archlinux.png" class="app-icon">
      <div class="tool-name">Arch Linux</div>
      <div class="tool-desc">轻量级滚动更新Linux系统</div>
      <a href="https://archlinux.org/" target="_blank" class="tool-btn">下载</a>
    </div>
  </div>

  <h2 style="margin-top: 40px;">手机系统</h2>

  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/xiaomihyperos.png" class="app-icon">
      <div class="tool-name">小米澎湃OS</div>
      <div class="tool-desc">小米自研人车家全生态操作系统</div>
      <a href="https://hyperos.miui.com/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/coloros.png" class="app-icon">
      <div class="tool-name">ColorOS</div>
      <div class="tool-desc">OPPO手机操作系统</div>
      <a href="https://www.coloros.com/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/flyme.png" class="app-icon">
      <div class="tool-name">Flyme</div>
      <div class="tool-desc">魅族手机操作系统</div>
      <a href="https://flyme.cn/" target="_blank" class="tool-btn">下载</a>
    </div>

    <div class="tool-card">
      <img src="img/realme.png" class="app-icon">
      <div class="tool-name">realme UI</div>
      <div class="tool-desc">realme手机操作系统</div>
      <a href="https://www.realme.com/" target="_blank" class="tool-btn">下载</a>
    </div>
  </div>

  <h2 style="margin-top: 40px;">系统工具</h2>

  <div class="tools-grid">
    

    <div class="tool-card">
      <img src="img/i4tools.png" class="app-icon">
      <div class="tool-name">i4tools</div>
      <div class="tool-desc">iOS设备管理工具</div>
      <a href="https://www.i4.cn/" target="_blank" class="tool-btn">下载</a>
    </div>
  </div>
</div>

<script src="search-data.js"></script>
<script src="search.js"></script>
</body>
</html>
