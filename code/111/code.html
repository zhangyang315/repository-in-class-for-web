<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>编程开发 - 个人资源站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="index.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i> 返回
    </a>
    <div class="logo">
      <i class="fas fa-tools"></i>
      <span>编程开发</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" class="search-input" placeholder="搜索工具">
    </div>
  </div>
</header>
<div class="container container-page">
  <h1 class="page-title">开发工具合集</h1>
  <p class="page-desc"></p>
  <div class="tools-grid">
    <div class="tool-card">
      <img src="img/vscode.png" class="app-icon">
      <div class="tool-name">VSCode</div>
      <div class="tool-desc">专业级代码编辑器</div>
      <a href="https://code.visualstudio.com/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/IntelliJ IDEA.svg" class="app-icon">
      <div class="tool-name">IntelliJ IDEA</div>
      <div class="tool-desc">专业级Java开发工具</div>
      <a href="https://www.jetbrains.com/idea/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/pycharm.webp" class="app-icon">
      <div class="tool-name">pycharm</div>
      <div class="tool-desc">专业级Python开发工具</div>
      <a href="https://www.jetbrains.com/pycharm/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/TRAE.png" class="app-icon">
      <div class="tool-name">trae</div>
      <div class="tool-desc">AI原生集成开发环境</div>
      <a href="https://www.trae.cn/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/Git 浏览器精简版.png" class="app-icon">
      <div class="tool-name">git</div>
      <div class="tool-desc">版本控制工具</div>
      <a href="https://git-scm.com/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/GitHub.png" class="app-icon">
      <div class="tool-name">GitHub</div>
      <div class="tool-desc">代码托管平台</div>
      <a href="https://github.com/" target="_blank" class="tool-btn">打开</a>
    </div>
    <div class="tool-card">
      <img src="img/微信开发者工具.png" class="app-icon">
      <div class="tool-name">微信开发者工具</div>
      <div class="tool-desc">微信官方小程序开发工具</div>
      <a href="https://developers.weixin.qq.com/miniprogram/dev/devtools/download.html" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="#" class="app-icon">
      <div class="tool-name">HBuilderX</div>
      <div class="tool-desc">HBuilderX</div>
      <a href="https://www.dcloud.io/hbuilderx.html" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/androidstudio.png" class="app-icon">
      <div class="tool-name">Android Studio</div>
      <div class="tool-desc">Android官方开发工具</div>
      <a href="https://developer.android.com/studio" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/java.png" class="app-icon">
      <div class="tool-name">Java</div>
      <div class="tool-desc">Java开发工具包</div>
      <a href="https://www.java.com/zh-CN/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/python.png" class="app-icon">
      <div class="tool-name">Python</div>
      <div class="tool-desc">Python编程语言</div>
      <a href="https://www.python.org/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/vmware.png" class="app-icon">
      <div class="tool-name">VMware</div>
      <div class="tool-desc">虚拟机软件</div>
      <a href="https://www.vmware.com/" target="_blank" class="tool-btn">下载</a>
    </div>
    <div class="tool-card">
      <img src="img/tuna.png" class="app-icon">
      <div class="tool-name">清华镜像站</div>
      <div class="tool-desc">清华大学开源软件镜像站</div>
      <a href="https://mirrors.tuna.tsinghua.edu.cn/" target="_blank" class="tool-btn">打开</a>
    </div>
  </div>
</div>
</body>
</html>
